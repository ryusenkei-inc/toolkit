
  # Rust のクレート（ルートに Cargo.toml があるリポのみ `sync` が追加）。ワークスペースのメンバーも横断
  - package-ecosystem: cargo
    directory: "/"
    # 頻度・rebase・公開直後のバージョンの回避は npm と同じ
    schedule:
      interval: monthly
    rebase-strategy: disabled
    cooldown:
      default-days: 2
    commit-message:
      prefix: build
      include: scope
    groups:
      # minor・patch は1つの PR にまとめる（major は個別の PR でレビュー）
      minor-and-patch:
        update-types:
          - minor
          - patch
