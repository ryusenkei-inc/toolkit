# 利用する側のリポの PR のタイトルの変更の再検査（再利用可能なワークフロー）。タイトルの検査だけで、依存の導入と履歴の取得を省略
#   CI と別のワークフローにする理由: 同じワークフローの後の実行がジョブ ci の結果を「スキップ」で上書きし、失敗を隠すため
name: Reusable PR title

on:
  workflow_call:

permissions:
  contents: read

jobs:
  title:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Node = 呼ぶ側の mise.toml
      - uses: jdx/mise-action@v5
      # タイトルは環境変数で受け渡し（式の展開によるコマンドの注入を防止）
      #   npx: prose-lint だけを取得し、版は呼ぶ側の package.json の指定に追従
      - name: PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$TITLE" > "$RUNNER_TEMP/title"
          npx --yes "@ryusenkei/prose-lint@$(node -p "require('./package.json').devDependencies['@ryusenkei/prose-lint']")" --commit-msg "$RUNNER_TEMP/title"
