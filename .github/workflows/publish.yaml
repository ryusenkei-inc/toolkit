# パッケージの公開。タグ `<package>@<version>`（例: prose-lint@0.1.0）で該当パッケージを npm に公開
# 認証 = npm の trusted publishing（OIDC）。トークンは保持しない。出どころ（provenance）を付与
name: publish

on:
  push:
    tags: ['*@*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      # `runtime@<version>` は実行時のライブラリ（packages/runtime/*）を同じバージョンでまとめて公開
      - name: タグとパッケージのバージョンの一致
        run: |
          name="${GITHUB_REF_NAME%@*}"; version="${GITHUB_REF_NAME#*@}"
          echo "$name" | grep -Eq '^[a-z0-9-]+$' || { echo "パッケージ名が不正: $name"; exit 1; }
          if [ "$name" = runtime ]; then dirs=$(ls -d packages/runtime/*/); filter='./packages/runtime/*'; else dirs="packages/$name/"; filter="./packages/$name"; fi
          for dir in $dirs; do
            actual=$(DIR="$dir" node -p "require('./' + process.env.DIR + 'package.json').version")
            test "$version" = "$actual" || { echo "タグ $version と ${dir}package.json $actual が不一致"; exit 1; }
          done
          echo "FILTER=$filter" >> "$GITHUB_ENV"
      # 公開済みのバージョンは飛ばす（まとめての公開の途中で失敗したときの再実行）
      - run: pnpm -r --filter "$FILTER" publish --no-git-checks
