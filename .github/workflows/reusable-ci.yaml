# 利用する側のリポの CI（再利用可能なワークフロー）。main 行きの PR の検査を1つのジョブに並べる
#   1つのジョブにする理由: GitHub Free はジョブごとに分単位で切り上げて計上するため
#   トリガー・concurrency は呼ぶ側に置く（例は packages/conventions の README）
name: Reusable CI

on:
  workflow_call:
    inputs:
      checks:
        description: 標準の検査の後に実行するコマンド（リポ独自の検査）
        type: string
        default: ''

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 秘密値の検査は全履歴が対象
      # Node・Terraform = 呼ぶ側の mise.toml
      - uses: jdx/mise-action@v4
      - uses: pnpm/action-setup@v6
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Prose lint
        run: pnpm lint:prose
      - name: Checks
        if: inputs.checks != ''
        env:
          CHECKS: ${{ inputs.checks }}
        run: bash -eo pipefail -c "$CHECKS"
      # squash merge → main のコミットのメッセージ = PR のタイトル（手元の commit-msg フックの対象外）
      #   タイトルは環境変数で受け渡し（式の展開によるコマンドの注入を防止）
      #   Dependabot の PR は英語の定型のタイトル → 対象外
      - name: PR title
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$TITLE" > "$RUNNER_TEMP/title"
          pnpm exec prose-lint --commit-msg "$RUNNER_TEMP/title"
      # gitleaks-action は組織での利用に有料ライセンスが必要 → CLI の公式イメージを直接実行
      - name: Secret scan
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --config /repo/.gitleaks.toml --redact --verbose
